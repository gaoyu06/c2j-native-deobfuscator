name: Build prebuilt DLL/SO agents only

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            runner: windows-latest
            target: x86_64-windows-gnu
            output: j2c_agent-windows-x64.dll

          - platform: windows
            arch: arm64
            runner: windows-latest
            target: aarch64-windows-gnu
            output: j2c_agent-windows-arm64.dll

          - platform: linux
            arch: x64
            runner: ubuntu-latest
            target: x86_64-linux-gnu
            output: j2c_agent-linux-x64.so

          - platform: linux
            arch: arm64
            runner: ubuntu-latest
            target: aarch64-linux-gnu
            output: j2c_agent-linux-arm64.so

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 headers
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build Windows DLL
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path native-out | Out-Null

          $output = Join-Path 'native-out' '${{ matrix.output }}'
          $zigArgs = @(
            'c++',
            '-target', '${{ matrix.target }}',
            '-std=c++17',
            '-O2',
            '-DNDEBUG',
            '-shared',
            '-Wno-nullability-completeness',
            "-I$env:JAVA_HOME\include",
            "-I$env:JAVA_HOME\include\win32",
            '-Inative\include',
            '-o', $output,
            'native\src\agent.cpp',
            'native\src\trace_writer.cpp',
            'native\src\jni_hook.cpp'
          )

          & zig @zigArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path $output)) {
            throw "Expected output was not created: $output"
          }
          if ((Get-Item $output).Length -eq 0) {
            throw "Output file is empty: $output"
          }

          Get-Item $output | Format-List Name,Length,FullName

      - name: Build Linux SO
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-out

          zig c++ \
            -target '${{ matrix.target }}' \
            -std=c++17 \
            -O2 \
            -DNDEBUG \
            -shared \
            -fPIC \
            -Wno-nullability-completeness \
            -I "$JAVA_HOME/include" \
            -I "$JAVA_HOME/include/linux" \
            -I native/include \
            -o 'native-out/${{ matrix.output }}' \
            native/src/agent.cpp \
            native/src/trace_writer.cpp \
            native/src/jni_hook.cpp

          test -s 'native-out/${{ matrix.output }}'
          ls -lh 'native-out/${{ matrix.output }}'
          file 'native-out/${{ matrix.output }}'

      - name: Test include filter on Java 21
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        shell: bash
        run: |
          python3 native/tests/include-filter/test_filter.py \
            --agent native-out/j2c_agent-linux-x64.so \
            --headers "$JAVA_HOME/include"

      - name: Upload native agent
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: native-out/${{ matrix.output }}
          if-no-files-found: error

  release:
    name: Publish four native agents
    needs: build-native
    runs-on: ubuntu-latest

    steps:
      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail

          expected=(
            j2c_agent-windows-x64.dll
            j2c_agent-windows-arm64.dll
            j2c_agent-linux-x64.so
            j2c_agent-linux-arm64.so
          )

          for filename in "${expected[@]}"; do
            if [[ ! -s "release-assets/$filename" ]]; then
              echo "ERROR: missing or empty release-assets/$filename" >&2
              exit 1
            fi
          done

          count=$(find release-assets -type f | wc -l)
          if [[ "$count" -ne 4 ]]; then
            echo "ERROR: expected exactly 4 files, got $count" >&2
            exit 1
          fi

          ls -lh release-assets

      - name: Generate tag name
        id: tag
        shell: bash
        run: |
          echo "TAG_NAME=native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: "Prebuilt Agents (${{ steps.tag.outputs.TAG_NAME }})"
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            release-assets/j2c_agent-windows-x64.dll
            release-assets/j2c_agent-windows-arm64.dll
            release-assets/j2c_agent-linux-x64.so
            release-assets/j2c_agent-linux-arm64.so

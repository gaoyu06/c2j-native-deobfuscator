name: Build CLI tools only

on:
  workflow_dispatch:

jobs:
  build-cli:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build CLI distributions
        working-directory: jvm
        run: .\gradlew.bat installDist --no-daemon

      - name: Archive entire project without .git
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "dist_package" -Force
          Get-ChildItem -Path . -Force | Where-Object { $_.Name -ne ".git" -and $_.Name -ne "dist_package" -and $_.Name -ne "project.zip" } | Copy-Item -Destination "dist_package" -Recurse -Force
          Compress-Archive -Path "dist_package\*" -DestinationPath "c2j-native-deobfuscator.zip"

      - name: Generate Tag Name
        id: tag
        shell: powershell
        run: |
          $tagName = "cli-" + (Get-Date -Format "yyyy.MM.dd-HHmm")
          echo "TAG_NAME=$tagName" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: "CLI Tools Pre-release (${{ steps.tag.outputs.TAG_NAME }})"
          prerelease: true
          files: c2j-native-deobfuscator.zip
